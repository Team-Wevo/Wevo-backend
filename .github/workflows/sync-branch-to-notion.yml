name: Sync GitHub Branches to Notion

on:
  create:

concurrency:
  group: notion-branch-${{ github.repository }}-${{ github.event.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Mark issue as in progress
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark Notion issue as in progress
        run: node .github/scripts/mark-notion-issue-in-progress.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
