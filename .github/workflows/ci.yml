name: Backend CI


# 실행 조건 - dev를 대상으로 PR 생성시
on:
  pull_request:
    branches:
      - dev

# Github Actions에 저장소 코드를 읽을 권한만 줌
permissions:
  contents: read

# build-and-test라는 작업 정의
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wevo_ci
          POSTGRES_USER: wevo_ci
          POSTGRES_PASSWORD: wevo_ci_password
          TZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wevo_ci -d wevo_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # PR의 코드를 Github Actions 가상 머신으로 내려 받음
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Verify Flyway and Hibernate against CI PostgreSQL
        env:
          WEVO_POSTGRES_SCHEMA_TEST: "true"
          WEVO_POSTGRES_JDBC_URL: jdbc:postgresql://localhost:5432/wevo_ci
          WEVO_POSTGRES_USERNAME: wevo_ci
          WEVO_POSTGRES_PASSWORD: wevo_ci_password
        run: ./gradlew postgresSchemaTest

      # 빌드 및 테스트 - Testcontainers PostgreSQL 통합 테스트를 포함한 전체 검증 단계
      - name: Build and test
        run: ./gradlew build
