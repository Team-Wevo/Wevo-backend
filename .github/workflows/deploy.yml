name: Production CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  deploy:
    name: Build image and deploy
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::$variable_name repository variable is not configured."
              exit 1
            fi
          done

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: wevo-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Define immutable image URI
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: echo "uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Deploy through Systems Manager
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          readonly SSM_DELIVERY_TIMEOUT_SECONDS=60
          readonly SSM_EXECUTION_TIMEOUT_SECONDS=600
          readonly SSM_POLL_INTERVAL_SECONDS=5
          readonly SSM_POLL_ATTEMPTS=$(((
            SSM_DELIVERY_TIMEOUT_SECONDS + SSM_EXECUTION_TIMEOUT_SECONDS
          ) / SSM_POLL_INTERVAL_SECONDS + 1))

          script_payload="$(base64 -w 0 .github/scripts/deploy-on-ec2.sh)"
          parameters="$(
            jq -cn \
              --arg script "$script_payload" \
              --arg image "$IMAGE_URI" \
              --arg region "$AWS_REGION" \
              --arg registry "$ECR_REGISTRY" \
              --arg execution_timeout "$SSM_EXECUTION_TIMEOUT_SECONDS" \
              '{
                commands: [
                  "set -eu",
                  "trap '\''rm -f /tmp/wevo-deploy.sh'\'' EXIT",
                  ("printf %s " + ($script | @sh) + " | base64 --decode > /tmp/wevo-deploy.sh"),
                  "chmod 700 /tmp/wevo-deploy.sh",
                  ("/usr/bin/env bash /tmp/wevo-deploy.sh "
                    + ($image | @sh) + " "
                    + ($region | @sh) + " "
                    + ($registry | @sh))
                ],
                executionTimeout: [$execution_timeout]
              }'
          )"

          command_id="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "Deploy Wevo backend ${GITHUB_SHA}" \
              --parameters "$parameters" \
              --timeout-seconds "$SSM_DELIVERY_TIMEOUT_SECONDS" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command ID: $command_id"
          status="Pending"

          for attempt in $(seq 1 "$SSM_POLL_ATTEMPTS"); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || true
            )"

            case "$status" in
              Success)
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                break
                ;;
            esac

            echo "Waiting for SSM deployment ($attempt/$SSM_POLL_ATTEMPTS, status: ${status:-Pending})..."
            sleep "$SSM_POLL_INTERVAL_SECONDS"
          done

          invocation="$(
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json
          )"
          echo "$invocation"
          status="$(jq -r '.Status // empty' <<<"$invocation")"

          if [[ "$status" != "Success" ]]; then
            echo "::error::Deployment failed with SSM status: ${status:-Unknown}"
            exit 1
          fi
