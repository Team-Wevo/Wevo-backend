name: wevo-backend

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - wevo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-wevo-backend:local}
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?DB_URL must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-2}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-2s}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set}
      INVITE_BASE_URL: ${INVITE_BASE_URL:?INVITE_BASE_URL must be set}
      # 초대 토큰 파생용 HMAC 비밀키. 누락되면 기동에 실패한다 — 기본값을 두면 누구나
      # 계산 가능한 토큰이 조용히 발급되므로 의도적으로 필수다.
      INVITE_TOKEN_SECRET: ${INVITE_TOKEN_SECRET:?INVITE_TOKEN_SECRET must be set}
      # 비인증 외부 검토 제출 남용 방지 — 기본값은 application.yml 에 있고 여기서는 덮어쓰기만 한다.
      # 필수 비밀값은 없다(IP 를 저장하지 않으므로 — 정책서 §6.2.4).
      REVIEW_RATE_LIMIT_LINK_PER_MINUTE: ${REVIEW_RATE_LIMIT_LINK_PER_MINUTE:-10}
      REVIEW_RATE_LIMIT_LINK_PER_HOUR: ${REVIEW_RATE_LIMIT_LINK_PER_HOUR:-40}
      REVIEW_RATE_LIMIT_FAIL_OPEN: ${REVIEW_RATE_LIMIT_FAIL_OPEN:-true}
      REVIEW_ANOMALY_RAPID_INTERVAL_SECONDS: ${REVIEW_ANOMALY_RAPID_INTERVAL_SECONDS:-10}
      REVIEW_ANOMALY_RAPID_PAIR_THRESHOLD: ${REVIEW_ANOMALY_RAPID_PAIR_THRESHOLD:-3}
      REVIEW_ANOMALY_DUPLICATE_SUMMARY_THRESHOLD: ${REVIEW_ANOMALY_DUPLICATE_SUMMARY_THRESHOLD:-2}
      AI_PROVIDER: ${AI_PROVIDER:?AI_PROVIDER must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
      OPENAI_API_MODEL: ${OPENAI_API_MODEL:?OPENAI_API_MODEL must be set}
      OPENAI_API_TIMEOUT: ${OPENAI_API_TIMEOUT:-60s}
      OPENAI_API_MAX_TOKENS: ${OPENAI_API_MAX_TOKENS:-4096}
      OPENAI_API_REASONING_EFFORT: ${OPENAI_API_REASONING_EFFORT:-medium}
      OPENAI_API_CONTEXT_LIMIT: ${OPENAI_API_CONTEXT_LIMIT:-1050000}
      OPENAI_PROMPT_CACHE_OPTIMIZATION_ENABLED: ${OPENAI_PROMPT_CACHE_OPTIMIZATION_ENABLED:-false}
      OPENAI_PROMPT_CACHE_EXPLICIT_FEATURES: ${OPENAI_PROMPT_CACHE_EXPLICIT_FEATURES:-}
      OPENAI_PROMPT_CACHE_EXPLICIT_MODELS: ${OPENAI_PROMPT_CACHE_EXPLICIT_MODELS:-gpt-5.6-luna}
      OPENAI_PROMPT_CACHE_TTL: ${OPENAI_PROMPT_CACHE_TTL:-30m}
      AI_DEFAULT_MAX_INPUT_TOKENS: ${AI_DEFAULT_MAX_INPUT_TOKENS:-100000}
      AI_SAFETY_MARGIN_TOKENS: ${AI_SAFETY_MARGIN_TOKENS:-8192}
      AI_ISSUE_DETECTION_MAX_INPUT_TOKENS: ${AI_ISSUE_DETECTION_MAX_INPUT_TOKENS:-64000}
      AI_OPINION_SYNTHESIS_MAX_INPUT_TOKENS: ${AI_OPINION_SYNTHESIS_MAX_INPUT_TOKENS:-72000}
      AI_DRAFT_GENERATION_MAX_INPUT_TOKENS: ${AI_DRAFT_GENERATION_MAX_INPUT_TOKENS:-48000}
      AI_DRAFT_REVIEW_MAX_INPUT_TOKENS: ${AI_DRAFT_REVIEW_MAX_INPUT_TOKENS:-64000}
      AI_AUTHOR_INTENT_MAX_INPUT_TOKENS: ${AI_AUTHOR_INTENT_MAX_INPUT_TOKENS:-24000}
      AI_AUTHOR_INTENT_MAX_OUTPUT_TOKENS: ${AI_AUTHOR_INTENT_MAX_OUTPUT_TOKENS:-512}
      AI_REVIEW_INTENT_COMPARISON_MAX_INPUT_TOKENS: ${AI_REVIEW_INTENT_COMPARISON_MAX_INPUT_TOKENS:-12000}
      AI_REVIEW_INTENT_COMPARISON_MAX_OUTPUT_TOKENS: ${AI_REVIEW_INTENT_COMPARISON_MAX_OUTPUT_TOKENS:-768}
      AI_OPINION_CLUSTERING_MAX_INPUT_TOKENS: ${AI_OPINION_CLUSTERING_MAX_INPUT_TOKENS:-24000}
      AI_OPINION_CLUSTERING_MAX_OUTPUT_TOKENS: ${AI_OPINION_CLUSTERING_MAX_OUTPUT_TOKENS:-1024}
      AI_PROJECT_FLOW_REVIEW_MAX_INPUT_TOKENS: ${AI_PROJECT_FLOW_REVIEW_MAX_INPUT_TOKENS:-96000}
      AI_PROJECT_FLOW_REVIEW_MAX_OUTPUT_TOKENS: ${AI_PROJECT_FLOW_REVIEW_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_STRUCTURED_OUTPUT_MAX_CORRECTION_RETRIES: ${AI_STRUCTURED_OUTPUT_MAX_CORRECTION_RETRIES:-2}
      AI_JOB_MAX_EXECUTIONS_PER_KEY: ${AI_JOB_MAX_EXECUTIONS_PER_KEY:-3}
      AI_OPERATIONS_ENABLED: ${AI_OPERATIONS_ENABLED:-true}
      AI_CIRCUIT_FAILURE_THRESHOLD: ${AI_CIRCUIT_FAILURE_THRESHOLD:-5}
      AI_CIRCUIT_OPEN_DURATION: ${AI_CIRCUIT_OPEN_DURATION:-30s}
      AI_CIRCUIT_HALF_OPEN_MAX_CALLS: ${AI_CIRCUIT_HALF_OPEN_MAX_CALLS:-1}
      # 운영 Provider를 활성화할 때 guardrail 누락을 애플리케이션 교체 전에 차단한다.
      AI_GUARDRAIL_ENABLED: ${AI_GUARDRAIL_ENABLED:?AI_GUARDRAIL_ENABLED must be set}
      AI_GUARDRAIL_POLICY_VERSION: ${AI_GUARDRAIL_POLICY_VERSION:-ai-guardrail-2026-08-02-v1}
      AI_QUOTA_USER_PER_MINUTE: ${AI_QUOTA_USER_PER_MINUTE:-6}
      AI_QUOTA_USER_PER_DAY: ${AI_QUOTA_USER_PER_DAY:-100}
      AI_QUOTA_PROJECT_PER_MINUTE: ${AI_QUOTA_PROJECT_PER_MINUTE:-20}
      AI_QUOTA_PROJECT_PER_DAY: ${AI_QUOTA_PROJECT_PER_DAY:-500}
      AI_QUOTA_ISSUE_DETECTION_PER_MINUTE: ${AI_QUOTA_ISSUE_DETECTION_PER_MINUTE:-200}
      AI_QUOTA_ISSUE_DETECTION_PER_DAY: ${AI_QUOTA_ISSUE_DETECTION_PER_DAY:-100000}
      AI_ISSUE_DETECTION_MAX_PROVIDER_REQUESTS: ${AI_ISSUE_DETECTION_MAX_PROVIDER_REQUESTS:-10}
      AI_QUOTA_OPINION_SYNTHESIS_PER_MINUTE: ${AI_QUOTA_OPINION_SYNTHESIS_PER_MINUTE:-200}
      AI_QUOTA_OPINION_SYNTHESIS_PER_DAY: ${AI_QUOTA_OPINION_SYNTHESIS_PER_DAY:-100000}
      AI_OPINION_SYNTHESIS_MAX_PROVIDER_REQUESTS: ${AI_OPINION_SYNTHESIS_MAX_PROVIDER_REQUESTS:-11}
      AI_QUOTA_DRAFT_GENERATION_PER_MINUTE: ${AI_QUOTA_DRAFT_GENERATION_PER_MINUTE:-200}
      AI_QUOTA_DRAFT_GENERATION_PER_DAY: ${AI_QUOTA_DRAFT_GENERATION_PER_DAY:-100000}
      AI_DRAFT_GENERATION_MAX_PROVIDER_REQUESTS: ${AI_DRAFT_GENERATION_MAX_PROVIDER_REQUESTS:-1}
      AI_QUOTA_DRAFT_REVIEW_PER_MINUTE: ${AI_QUOTA_DRAFT_REVIEW_PER_MINUTE:-200}
      AI_QUOTA_DRAFT_REVIEW_PER_DAY: ${AI_QUOTA_DRAFT_REVIEW_PER_DAY:-100000}
      AI_DRAFT_REVIEW_MAX_PROVIDER_REQUESTS: ${AI_DRAFT_REVIEW_MAX_PROVIDER_REQUESTS:-1}
      AI_QUOTA_AUTHOR_INTENT_PER_MINUTE: ${AI_QUOTA_AUTHOR_INTENT_PER_MINUTE:-200}
      AI_QUOTA_AUTHOR_INTENT_PER_DAY: ${AI_QUOTA_AUTHOR_INTENT_PER_DAY:-100000}
      AI_AUTHOR_INTENT_MAX_PROVIDER_REQUESTS: ${AI_AUTHOR_INTENT_MAX_PROVIDER_REQUESTS:-1}
      AI_QUOTA_REVIEW_INTENT_PER_MINUTE: ${AI_QUOTA_REVIEW_INTENT_PER_MINUTE:-200}
      AI_QUOTA_REVIEW_INTENT_PER_DAY: ${AI_QUOTA_REVIEW_INTENT_PER_DAY:-100000}
      AI_REVIEW_INTENT_MAX_PROVIDER_REQUESTS: ${AI_REVIEW_INTENT_MAX_PROVIDER_REQUESTS:-1}
      AI_QUOTA_OPINION_CLUSTERING_PER_MINUTE: ${AI_QUOTA_OPINION_CLUSTERING_PER_MINUTE:-200}
      AI_QUOTA_OPINION_CLUSTERING_PER_DAY: ${AI_QUOTA_OPINION_CLUSTERING_PER_DAY:-100000}
      AI_OPINION_CLUSTERING_MAX_PROVIDER_REQUESTS: ${AI_OPINION_CLUSTERING_MAX_PROVIDER_REQUESTS:-11}
      AI_QUOTA_PROJECT_FLOW_REVIEW_PER_MINUTE: ${AI_QUOTA_PROJECT_FLOW_REVIEW_PER_MINUTE:-200}
      AI_QUOTA_PROJECT_FLOW_REVIEW_PER_DAY: ${AI_QUOTA_PROJECT_FLOW_REVIEW_PER_DAY:-100000}
      AI_PROJECT_FLOW_REVIEW_MAX_PROVIDER_REQUESTS: ${AI_PROJECT_FLOW_REVIEW_MAX_PROVIDER_REQUESTS:-36}
      AI_PROJECT_DAILY_COST_BUDGET_USD: ${AI_PROJECT_DAILY_COST_BUDGET_USD:-50.000000}
      AI_PROJECT_MONTHLY_COST_BUDGET_USD: ${AI_PROJECT_MONTHLY_COST_BUDGET_USD:-1000.000000}
      AI_MAX_ESTIMATED_JOB_COST_USD: ${AI_MAX_ESTIMATED_JOB_COST_USD:-10.000000}
      AI_PRICING_VERSION: ${AI_PRICING_VERSION:-openai-2026-07-31-standard}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Seoul}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  wevo-redis-data:
