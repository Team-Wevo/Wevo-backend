spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2s}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
    show-sql: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

wevo:
  ai:
    # 운영에서는 누락과 의도적 비활성화(AI_PROVIDER=none)를 구분한다.
    provider: ${AI_PROVIDER}
    guardrails:
      enabled: ${AI_GUARDRAIL_ENABLED:false}
      policy-version: ${AI_GUARDRAIL_POLICY_VERSION:ai-guardrail-2026-08-02-v1}
      recovery:
        enabled: ${AI_GUARDRAIL_RECOVERY_ENABLED:true}
        interval: ${AI_GUARDRAIL_RECOVERY_INTERVAL:60s}
        orphan-grace: ${AI_GUARDRAIL_ORPHAN_GRACE:5m}
        batch-size: ${AI_GUARDRAIL_RECOVERY_BATCH_SIZE:100}
      user:
        per-minute: ${AI_QUOTA_USER_PER_MINUTE:6}
        per-day: ${AI_QUOTA_USER_PER_DAY:100}
      project:
        per-minute: ${AI_QUOTA_PROJECT_PER_MINUTE:20}
        per-day: ${AI_QUOTA_PROJECT_PER_DAY:500}
      features:
        issue-detection:
          per-minute: ${AI_QUOTA_ISSUE_DETECTION_PER_MINUTE:200}
          per-day: ${AI_QUOTA_ISSUE_DETECTION_PER_DAY:100000}
          max-provider-requests: ${AI_ISSUE_DETECTION_MAX_PROVIDER_REQUESTS:11}
        opinion-synthesis:
          per-minute: ${AI_QUOTA_OPINION_SYNTHESIS_PER_MINUTE:200}
          per-day: ${AI_QUOTA_OPINION_SYNTHESIS_PER_DAY:100000}
          max-provider-requests: ${AI_OPINION_SYNTHESIS_MAX_PROVIDER_REQUESTS:11}
        draft-generation:
          per-minute: ${AI_QUOTA_DRAFT_GENERATION_PER_MINUTE:200}
          per-day: ${AI_QUOTA_DRAFT_GENERATION_PER_DAY:100000}
          max-provider-requests: ${AI_DRAFT_GENERATION_MAX_PROVIDER_REQUESTS:1}
        draft-review:
          per-minute: ${AI_QUOTA_DRAFT_REVIEW_PER_MINUTE:200}
          per-day: ${AI_QUOTA_DRAFT_REVIEW_PER_DAY:100000}
          max-provider-requests: ${AI_DRAFT_REVIEW_MAX_PROVIDER_REQUESTS:1}
        author-intent-extraction:
          per-minute: ${AI_QUOTA_AUTHOR_INTENT_PER_MINUTE:200}
          per-day: ${AI_QUOTA_AUTHOR_INTENT_PER_DAY:100000}
          max-provider-requests: ${AI_AUTHOR_INTENT_MAX_PROVIDER_REQUESTS:1}
        review-intent-comparison:
          per-minute: ${AI_QUOTA_REVIEW_INTENT_PER_MINUTE:200}
          per-day: ${AI_QUOTA_REVIEW_INTENT_PER_DAY:100000}
          max-provider-requests: ${AI_REVIEW_INTENT_MAX_PROVIDER_REQUESTS:1}
        opinion-clustering:
          per-minute: ${AI_QUOTA_OPINION_CLUSTERING_PER_MINUTE:200}
          per-day: ${AI_QUOTA_OPINION_CLUSTERING_PER_DAY:100000}
          max-provider-requests: ${AI_OPINION_CLUSTERING_MAX_PROVIDER_REQUESTS:11}
        project-flow-review:
          per-minute: ${AI_QUOTA_PROJECT_FLOW_REVIEW_PER_MINUTE:200}
          per-day: ${AI_QUOTA_PROJECT_FLOW_REVIEW_PER_DAY:100000}
          max-provider-requests: ${AI_PROJECT_FLOW_REVIEW_MAX_PROVIDER_REQUESTS:36}
        project-title-suggestion:
          per-minute: ${AI_QUOTA_PROJECT_TITLE_PER_MINUTE:200}
          per-day: ${AI_QUOTA_PROJECT_TITLE_PER_DAY:100000}
          max-provider-requests: ${AI_PROJECT_TITLE_MAX_PROVIDER_REQUESTS:1}
        # 의견 제출마다 동기로 도는 가드레일이라 호출량이 많다 — quota 를 넉넉히 둔다.
        # (fail-closed 라 quota 소진 시 정상 제출도 막히므로 여유가 필요)
        opinion-content-guardrail:
          per-minute: ${AI_QUOTA_OPINION_GUARDRAIL_PER_MINUTE:600}
          per-day: ${AI_QUOTA_OPINION_GUARDRAIL_PER_DAY:200000}
          max-provider-requests: ${AI_OPINION_GUARDRAIL_MAX_PROVIDER_REQUESTS:3}
      cost:
        daily-budget-usd: ${AI_PROJECT_DAILY_COST_BUDGET_USD:50.000000}
        monthly-budget-usd: ${AI_PROJECT_MONTHLY_COST_BUDGET_USD:1000.000000}
        max-estimated-job-cost-usd: ${AI_MAX_ESTIMATED_JOB_COST_USD:10.000000}
    operations:
      enabled: ${AI_OPERATIONS_ENABLED:true}
      circuit-breaker:
        failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:5}
        open-duration: ${AI_CIRCUIT_OPEN_DURATION:30s}
        half-open-max-calls: ${AI_CIRCUIT_HALF_OPEN_MAX_CALLS:1}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: never
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN}
  invite:
    base-url: ${INVITE_BASE_URL}
  review:
    # 운영은 HTTPS이므로 항상 켠다. 환경 변수는 HTTPS가 아직 없는 임시 배포에서만 끄기 위한 것이다.
    cookie-secure: ${REVIEW_COOKIE_SECURE:true}

logging:
  level:
    org.hibernate.SQL: WARN
