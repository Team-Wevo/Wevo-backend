spring:
  config:
    import: optional:file:.env[.properties]

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      # Flyway V1이 스키마를 생성하고 Hibernate는 엔티티 매핑 일치 여부만 검사한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true

# 비밀 값은 .env 로 주입 (application.yml 의 유효 시간/엔드포인트와 병합)
jwt:
  secret: ${JWT_SECRET}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}   # 카카오는 선택

wevo:
  ai:
    provider: ${AI_PROVIDER:nvidia}
    guardrails:
      # 로컬은 Redis quota 통합 검증 task 외에는 비용 guardrail을 활성화하지 않는다.
      enabled: false
