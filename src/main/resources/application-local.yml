spring:
  config:
    import: optional:file:.env[.properties]

  ai:
    model:
      chat: openai
      embedding: none
    openai:
      api-key: ${NVIDIA_API_KEY}
      base-url: ${NVIDIA_API_BASE_URL:https://integrate.api.nvidia.com}/v1
      timeout: ${NVIDIA_API_TIMEOUT:60s}
      max-retries: 0
      chat:
        model: ${NVIDIA_API_MODEL:mistralai/mistral-medium-3.5-128b}
        max-tokens: ${NVIDIA_API_MAX_TOKENS:4096}
        temperature: ${NVIDIA_API_TEMPERATURE:0.1}

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: true

# 비밀 값은 .env 로 주입 (application.yml 의 유효 시간/엔드포인트와 병합)
jwt:
  secret: ${JWT_SECRET}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET:}   # 카카오는 선택

wevo:
  ai:
    provider: ${AI_PROVIDER:nvidia}
