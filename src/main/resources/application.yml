spring:
  application:
    name: Wevo-backend

  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false

wevo:
  ai:
    provider: none
    default-options:
      model: ${OPENAI_API_MODEL:gpt-5.6-luna}
      timeout: ${OPENAI_API_TIMEOUT:60s}
      # system/user prompt + JSON schema + context payload 전체의 상한
      max-input-tokens: ${AI_DEFAULT_MAX_INPUT_TOKENS:100000}
      max-output-tokens: ${OPENAI_API_MAX_TOKENS:4096}
      model-context-limit: ${OPENAI_API_CONTEXT_LIMIT:1050000}
      # input/output 예약에 포함되지 않는 context window 안전 여유
      safety-margin-tokens: ${AI_SAFETY_MARGIN_TOKENS:8192}
      token-estimation-policy: conservative-char-v1
      single-input-overflow-policy: reject-oversized-input-v1
      max-retries: ${AI_MAX_RETRIES:2}
      initial-backoff: 500ms
      max-backoff: 8s
    features:
      issue-detection:
        max-input-tokens: ${AI_ISSUE_DETECTION_MAX_INPUT_TOKENS:64000}
      opinion-synthesis:
        max-input-tokens: ${AI_OPINION_SYNTHESIS_MAX_INPUT_TOKENS:72000}
      draft-generation:
        max-input-tokens: ${AI_DRAFT_GENERATION_MAX_INPUT_TOKENS:48000}
      draft-review:
        max-input-tokens: ${AI_DRAFT_REVIEW_MAX_INPUT_TOKENS:64000}
      author-intent-extraction:
        max-input-tokens: ${AI_AUTHOR_INTENT_MAX_INPUT_TOKENS:24000}
        max-output-tokens: ${AI_AUTHOR_INTENT_MAX_OUTPUT_TOKENS:512}
      review-intent-comparison:
        max-input-tokens: ${AI_REVIEW_INTENT_COMPARISON_MAX_INPUT_TOKENS:12000}
        max-output-tokens: ${AI_REVIEW_INTENT_COMPARISON_MAX_OUTPUT_TOKENS:768}
      opinion-clustering:
        max-input-tokens: ${AI_OPINION_CLUSTERING_MAX_INPUT_TOKENS:24000}
        max-output-tokens: ${AI_OPINION_CLUSTERING_MAX_OUTPUT_TOKENS:1024}
      project-flow-review:
        max-input-tokens: ${AI_PROJECT_FLOW_REVIEW_MAX_INPUT_TOKENS:96000}
        max-output-tokens: ${AI_PROJECT_FLOW_REVIEW_MAX_OUTPUT_TOKENS:4096}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_API_BASE_URL:https://api.openai.com}
      model: ${OPENAI_API_MODEL:gpt-5.6-luna}
      timeout: ${OPENAI_API_TIMEOUT:60s}
      max-output-tokens: ${OPENAI_API_MAX_TOKENS:4096}
      reasoning-effort: ${OPENAI_API_REASONING_EFFORT:medium}
      # 2026-07-31 공식 모델 snapshot. Java enum으로 고정하지 않는다.
      model-context-limit: ${OPENAI_API_CONTEXT_LIMIT:1050000}
      prompt-cache:
        # false이면 OpenAI의 자동 implicit baseline만 사용한다.
        optimization-enabled: ${OPENAI_PROMPT_CACHE_OPTIMIZATION_ENABLED:false}
        # comma-separated 기능 key. 측정·승인된 기능만 explicit breakpoint를 사용한다.
        explicit-features: ${OPENAI_PROMPT_CACHE_EXPLICIT_FEATURES:}
        explicit-models: ${OPENAI_PROMPT_CACHE_EXPLICIT_MODELS:gpt-5.6-luna}
        ttl: ${OPENAI_PROMPT_CACHE_TTL:30m}
    structured-output:
      max-correction-retries: ${AI_STRUCTURED_OUTPUT_MAX_CORRECTION_RETRIES:2}
    guardrails:
      # prod에서 AI provider를 켜면 startup validator가 true와 pricing snapshot을 강제한다.
      enabled: false
      recovery:
        enabled: true
        interval: 60s
        orphan-grace: 5m
        batch-size: 100
    jobs:
      max-executions-per-key: ${AI_JOB_MAX_EXECUTIONS_PER_KEY:3}
      application-timeout: ${AI_JOB_APPLICATION_TIMEOUT:15m}
    pricing:
      version: ${AI_PRICING_VERSION:openai-2026-07-31-standard}
      models:
        "[gpt-5.6-luna]":
          input-per-million-tokens: 0.20
          cache-read-per-million-tokens: 0.02
          cache-write-per-million-tokens: 0.25
          output-per-million-tokens: 1.20
    audit:
      recovery-enabled: true
      recovery-interval: 60s
      orphan-grace: 30s
    operations:
      # 전역/기능 kill switch. false이면 새 job 생성과 provider 실행만 차단한다.
      enabled: ${AI_OPERATIONS_ENABLED:true}
      circuit-breaker:
        failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:5}
        open-duration: ${AI_CIRCUIT_OPEN_DURATION:30s}
        half-open-max-calls: ${AI_CIRCUIT_HALF_OPEN_MAX_CALLS:1}
    rollout:
      # 조합과 route가 모두 검증되기 전에는 baseline 설정을 그대로 사용한다.
      enabled: false

# JWT 유효 시간 (비밀 키(jwt.secret)는 프로파일별 설정에서 주입)
jwt:
  access-token-validity-ms: 1800000       # 30분
  refresh-token-validity-ms: 1209600000   # 14일

# 소셜 제공자 공개 엔드포인트 (client-id/secret 은 프로파일별 설정에서 주입)
oauth:
  timeout:
    connect: 3s
    read: 5s
  google:
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  kakao:
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

# CORS 허용 Origin (프론트엔드 개발 서버)
app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  invite:
    # 공유용 초대 링크 접두어. 사용자가 클릭할 프론트 초대 페이지 URL의 앞부분이며, 뒤에 토큰이 붙는다.
    base-url: ${INVITE_BASE_URL:http://localhost:3000/invite/}
    # 초대 토큰 파생용 HMAC 비밀키. 기본값을 두지 않는다 — 비어 있으면 기동 시점에 실패시켜
    # 누구나 계산 가능한 토큰이 조용히 발급되는 상황을 막는다. (CLAUDE.md §0)
    token-secret: ${INVITE_TOKEN_SECRET}
  review:
    # 익명 검토자 키 쿠키(wevo_reviewer_id)의 Secure 속성. HTTPS에서만 쿠키를 보내게 한다.
    # 기본값이 false인 이유는 로컬이 HTTP이기 때문이다 — 켜면 브라우저가 쿠키를 저장하지 않아
    # 검토자 키가 매 요청 새로 발급되고 중복 제출 차단이 무력화된다. prod에서는 true다.
    cookie-secure: ${REVIEW_COOKIE_SECURE:false}
    # 비인증 외부 검토 제출(/public)의 남용 방지. 외부 검토자는 신원 보증이 없어(익명 검토자 키는
    # 클라이언트가 만드는 값) "브라우저당 1회"만으로는 자동화된 대량 제출을 막지 못한다.
    # IP 기준 값은 두지 않는다 — 정책서 §6.2.4가 공유망 오탐을 이유로 배제한다.
    abuse:
      rate-limit:
        # 링크당 허용 제출 시도(시도 기준 — 실패한 제출도 센다). 링크 정원이 20명이라 분당 10회면
        # 정상 사용에 걸리지 않으면서 슬롯을 순식간에 채우는 자동화의 속도는 낮아진다.
        per-link-per-minute: ${REVIEW_RATE_LIMIT_LINK_PER_MINUTE:10}
        per-link-per-hour: ${REVIEW_RATE_LIMIT_LINK_PER_HOUR:40}
        # Redis 장애 시 제출을 통과시킬지. 기본 true — 외부 검토는 확정 조건에 포함되지 않는
        # 보조 기능이라(정책서 §6.2) 카운터 장애로 정상 검토를 막는 손해가 더 크다.
        # 남용이 실제로 관측되면 false 로 뒤집어 잠근다.
        fail-open: ${REVIEW_RATE_LIMIT_FAIL_OPEN:true}
      # 결과 조회에 표시할 이상 신호 기준. 차단이 아니라 팀장 화면 표시용이다.
      anomaly:
        # 인접 제출 간격이 이 초 미만이면 "사람 속도가 아니다"로 센다. 본문을 읽고 한 문장을
        # 쓰는 데 10초도 걸리지 않는 경우는 사실상 자동 제출이다.
        rapid-interval-seconds: ${REVIEW_ANOMALY_RAPID_INTERVAL_SECONDS:10}
        # 그런 인접 쌍이 이 수 이상이면 의심으로 표시한다. 1~2건은 두 사람이 동시에 낸
        # 우연일 수 있어 하한을 둔다.
        rapid-pair-threshold: ${REVIEW_ANOMALY_RAPID_PAIR_THRESHOLD:3}
        # 같은 문장이 이 수 이상 반복되면 의심으로 표시한다. 서로 다른 사람이 토씨까지 같은
        # 문장을 낼 이유가 없다.
        duplicate-summary-threshold: ${REVIEW_ANOMALY_DUPLICATE_SUMMARY_THRESHOLD:2}

# OpenAiChatModel은 빈 choices 경고에 Prompt 객체를 포함하므로 원문 노출을 막는다.
logging:
  level:
    org.springframework.ai.openai: ERROR

springdoc:
  # 응답 Content-Type을 문서에 명시한다. 지정하지 않으면 모든 응답이 `*/*`로 나가, 문서만 봐서는
  # JSON인지 알 수 없고 FE 코드 생성기가 타입을 좁히지 못한다. (CLAUDE.md §5.3)
  #
  # 컨트롤러의 @*Mapping에 `produces`를 거는 방식은 쓰지 않는다 — 걸어두면 그 media type이 요청
  # 속성으로 남아, 예외 발생 시 GlobalExceptionHandler가 만든 JSON 실패 응답까지 같은 타입으로 써야
  # 해서 파일 응답 API(완성본 다운로드)가 406으로 깨진다. 이 설정은 문서 생성에만 관여하고
  # 실제 협상에는 영향을 주지 않는다.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
