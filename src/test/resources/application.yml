spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

  datasource:
    url: jdbc:h2:mem:wevo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 일반 단위·경량 통합 테스트는 H2 create-drop을 사용한다. PostgreSQL 전용 V1 검증은
  # 빈 PostgreSQL에서 별도로 수행하므로 이 프로파일에서는 Flyway를 실행하지 않는다.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop

  data:
    redis:
      repositories:
        enabled: false

wevo:
  ai:
    provider: nvidia
    default-options:
      model: test-model
      timeout: 1s
      max-input-tokens: 1000
      max-output-tokens: 128
      model-context-limit: 2048
      safety-margin-tokens: 256
      token-estimation-policy: conservative-char-v1
      single-input-overflow-policy: reject-oversized-input-v1
      max-retries: 0
      initial-backoff: 0ms
      max-backoff: 0ms
    nvidia:
      api-key: test-nvidia-api-key
      base-url: http://127.0.0.1:1
      temperature: 0.1
      reasoning-effort: none
    structured-output:
      max-correction-retries: 2
    guardrails:
      enabled: false
    jobs:
      max-executions-per-key: 3
      # 실행 폴러는 테스트에서 기본 비활성화한다 — 스케줄러 검증 테스트에서만 명시적으로 켠다.
      dispatch-enabled: false
    pricing:
      version: test-v1
      models:
        "[gpt-5.6-luna]":
          input-per-million-tokens: 0.20
          cache-read-per-million-tokens: 0.02
          cache-write-per-million-tokens: 0.25
          output-per-million-tokens: 1.20
    audit:
      recovery-enabled: false
      recovery-interval: 60s
      orphan-grace: 30s

# 테스트용 더미 값 (컨텍스트 로딩용, 실제 외부 호출 없음)
jwt:
  secret: test-secret-key-for-wevo-backend-that-is-long-enough-000000
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1209600000

oauth:
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    token-uri: http://localhost/google/token
    user-info-uri: http://localhost/google/userinfo
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
    token-uri: http://localhost/kakao/token
    user-info-uri: http://localhost/kakao/userinfo

app:
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    org.springframework.ai.openai: ERROR
